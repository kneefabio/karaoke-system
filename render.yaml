{
  "services": [
    {
      "type": "web",
      "name": "karaoke-backend",
      "runtime": "python",
      "buildCommand": "cd backend && pip install -r requirements.txt",
      "startCommand": "cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT",
      "envVars": [
        {
          "key": "MONGO_URL",
          "sync": false
        },
        {
          "key": "DB_NAME",
          "value": "karaoke_db"
        },
        {
          "key": "JWT_SECRET",
          "generateValue": true
        },
        {
          "key": "CORS_ORIGINS",
          "sync": false
        }
      ]
    }
  ]
}

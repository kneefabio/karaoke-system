<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karaoke Photo Overlay</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Status indicator -->
  <div id="status" class="status disconnected">
    <span id="status-text">Connecting...</span>
  </div>

  <!-- Photo container -->
  <div id="photo-container"></div>

  <!-- Config (hidden, press C to toggle) -->
  <div id="config" style="display: none;">
    <h3>🎯 Configurazione Overlay</h3>
    <div class="config-field">
      <label>Username Admin (per filtrare foto):</label>
      <input type="text" id="admin-username" placeholder="es: admin1">
      <p class="help-text">Inserisci il tuo username admin per vedere solo le tue foto</p>
    </div>
    <div class="config-field">
      <label>Backend URL:</label>
      <input type="text" id="backend-url" value="ws://127.0.0.1:8001/ws/photos">
    </div>
    <button id="save-config">💾 Salva</button>
    <button id="close-config">❌ Chiudi</button>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
